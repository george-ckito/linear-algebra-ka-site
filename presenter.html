<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>მომხსენებლის ფანჯარა</title><link rel="stylesheet" href="presenter.css"><style>
@font-face{font-family:Georgian;src:url(fonts/NotoSansGeorgian-Regular.ttf)}body,button{font-family:Georgian,"Segoe UI",sans-serif}main{max-width:1300px}h1{font-size:28px}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:32px}img{width:100%;border:1px solid var(--line)}h2{font-size:18px;color:var(--cyan);font-weight:500}#notes p{font-size:19px;line-height:1.9}.time{font:30px "Segoe UI";color:#f5c96a}#nextTitle{color:var(--muted)}#answer{color:#86dfb5}.banner{padding:12px 0;color:#f5c96a}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><main><p class="banner">ეს ფანჯარა მხოლოდ მომხსენებლისთვისაა. პროექტორზე პრეზენტაციის ფანჯარა აჩვენეთ.</p><header class="top"><span id="position">კავშირის მოლოდინი</span><span class="time" id="timer">00:00 / 45:00</span></header><h1 id="title">გახსენით პრეზენტაციიდან</h1>
<div class="controls"><button data-command="prev">← წინა</button><button data-command="next" class="primary">შემდეგი →</button><button data-command="toggle">პაუზა / გაგრძელება</button><button data-command="replay">გამეორება</button></div>
<div class="grid"><section><h2>მიმდინარე სლაიდის ბოლო კადრი</h2><img id="current" alt="მიმდინარე სლაიდი"><h2>შემდეგი</h2><p id="nextTitle"></p><img id="upcoming" alt="შემდეგი სლაიდი"></section><section><h2 id="planned">გეგმით</h2><div id="notes"></div><p id="question"></p><p id="answer"></p></section></div><p><a href="speaker-notes.html" target="_blank">ყველა ჩანაწერი / ბეჭდვა</a></p></main><script src="lesson-data.js"></script><script>
const $=s=>document.querySelector(s);let last=-1;
function command(c){if(window.opener)window.opener.postMessage({type:'lesson-command',command:c},'*')}
document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>command(b.dataset.command));
window.addEventListener('message',e=>{if(e.source!==window.opener||e.data.type!=='lesson-state')return;const m=e.data;$('#timer').textContent=`${String(Math.floor(m.elapsed/60)).padStart(2,'0')}:${String(m.elapsed%60).padStart(2,'0')} / 45:00`;$('[data-command="next"]').textContent=m.finished?'შემდეგი →':'დასრულება →';if(m.index===last)return;last=m.index;const s=LESSON[last];$('#position').textContent=`სლაიდი ${last+1} / 30`;$('#title').textContent=s.title;$('#planned').textContent=`გეგმით ${s.start}–${s.end} · ${s.seconds} წამი`;
$('#notes').replaceChildren(...s.notes.map(t=>{let p=document.createElement('p');p.textContent=t;return p}));$('#question').textContent=s.question?`კითხვა: ${s.question}`:'';$('#answer').textContent=s.answer?`პასუხი: ${s.answer}`:'';$('#current').src=`posters/${String(last+1).padStart(2,'0')}.jpg`;$('#upcoming').hidden=last===29;$('#nextTitle').textContent=last<29?LESSON[last+1].title:'დასასრული';if(last<29)$('#upcoming').src=`posters/${String(last+2).padStart(2,'0')}.jpg`;
});if(window.opener)window.opener.postMessage({type:'presenter-ready'},'*');
document.addEventListener('keydown',e=>{if(e.target.matches('button')&&[' ','Enter'].includes(e.key))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();command('next')}else if(e.key==='ArrowLeft')command('prev');else if(e.key.toLowerCase()==='p')command('toggle');else if(e.key.toLowerCase()==='r')command('replay')});
</script></body></html>
